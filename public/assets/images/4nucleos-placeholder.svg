<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#234E70"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="500" height="280" rx="12" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- 4 Núcleos geométricos interconectados -->
  <g transform="translate(250, 105)">
    <!-- Conexiones orbitales sutiles -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- 4 Nodos / Núcleos -->
    <circle cx="-34" cy="-34" r="16" fill="url(#coreGrad)"/>
    <circle cx="34" cy="-34" r="16" fill="url(#coreGrad)"/>
    <circle cx="-34" cy="34" r="16" fill="url(#coreGrad)"/>
    <circle cx="34" cy="34" r="16" fill="url(#coreGrad)"/>
    
    <!-- Centro de enlace -->
    <circle cx="0" cy="0" r="8" fill="#234E70"/>
  </g>

  <!-- Tipografía del logo de 4 Núcleos -->
  <text x="250" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">
    4 NÚCLEOS
  </text>
  <text x="250" y="222" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="3">
    SOFTWARE STUDIO &amp; LABS
  </text>
</svg>

